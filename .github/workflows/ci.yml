# Free for public repositories (GitHub Actions minutes are unlimited there).
# Releases are cut locally with `pnpm release`, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # ubuntu-latest ships Google Chrome, which the e2e tests use (channel "chrome").
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightreign-buildrocket-${{ github.sha }}
          path: |
            dist/index.html
            test-results/
          retention-days: 7
          if-no-files-found: ignore
